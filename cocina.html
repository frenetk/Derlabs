<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="robots" content="noindex, nofollow">
<title>Cocina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<style>
/* Pantalla de cocina (comandas) — Caja local DerLabs. Para un monitor o tablet en la cocina. */
:root{--bg:#0B0B0B;--bg2:#161616;--bg3:#222;--line:rgba(255,255,255,.09);--txt:#F5F5F5;--txt2:#A3A3A3;--ok:#22A06B;--warn:#F59E0B;--bad:#EF4444;--info:#3B82F6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Nunito,system-ui,sans-serif}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer;touch-action:manipulation}
input{background:var(--bg3);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;font-size:16px}
.oculto{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;font-weight:900;background:var(--bg3);white-space:nowrap}
.btn-ok{background:var(--ok);color:#fff}
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.lbox{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}
#lErr{color:#FCA5A5;font-size:13px;min-height:18px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:18px;margin-right:auto}
.cnt{background:var(--bad);color:#fff;border-radius:999px;padding:3px 11px;font-weight:900}
#reloj{font-weight:900;font-size:18px;color:var(--txt2)}
.filtros{display:flex;gap:6px}
.fil{padding:8px 12px;border-radius:999px;background:var(--bg3);font-weight:800;font-size:13px}
.fil.on{background:var(--txt);color:#111}
#tablero{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px;align-items:start}
.tk{background:var(--bg2);border-radius:16px;border-top:8px solid var(--ok);display:flex;flex-direction:column;overflow:hidden;animation:entra .4s ease}
@keyframes entra{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.tk.amarillo{border-top-color:var(--warn)}.tk.rojo{border-top-color:var(--bad)}
.tk.nuevo{box-shadow:0 0 0 3px var(--info)}
.tk-h{padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line)}
.tk-h b{font-size:20px;line-height:1.15}
.tk-h small{display:block;color:var(--txt2);font-weight:800;font-size:12.5px;margin-top:2px}
.min{font-size:22px;font-weight:900;white-space:nowrap}
.tk.amarillo .min{color:var(--warn)}.tk.rojo .min{color:var(--bad)}
.tk-b{padding:6px 14px 10px}
.li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:17px;font-weight:800;cursor:pointer}
.li:last-child{border:0}
.li .q{min-width:32px;font-size:19px}
.li small{display:block;font-size:14px;color:#FCD34D;font-weight:800}
.li.hecho{opacity:.35;text-decoration:line-through}
.tk-nota{margin:0 14px 10px;padding:8px 10px;border-radius:10px;background:rgba(245,158,11,.15);color:#FCD34D;font-weight:800;font-size:14px}
.tk-f{padding:10px 14px 14px}
.tk-f .btn{width:100%;min-height:54px;font-size:17px}
.vacio{grid-column:1/-1;text-align:center;color:var(--txt2);padding:80px 16px;font-size:18px}
.listos{padding:0 14px 20px}
.listos h3{font-size:13px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 8px}
.listos div{display:flex;flex-wrap:wrap;gap:8px}
.listos span{background:var(--bg2);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:800;color:var(--txt2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:12px 18px;border-radius:12px;font-weight:800;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="login" class="oculto">
  <div class="lbox">
    <h1>👨‍🍳 Cocina</h1>
    <p style="color:var(--txt2)">Entra con la cuenta de cocina o de administrador</p>
    <input id="lUsu" placeholder="Usuario o correo" autocapitalize="none" autocomplete="username">
    <input id="lPass" type="password" placeholder="Clave" autocomplete="current-password">
    <button class="btn btn-ok" id="lBtn">Entrar</button>
    <p id="lErr"></p>
  </div>
</div>
<div id="app" class="oculto">
  <header>
    <b id="hNombre">Cocina</b>
    <div class="filtros"><button class="fil on" data-f="todo">Todo</button><button class="fil" data-f="local">🍽️ Local</button><button class="fil" data-f="web">🌐 Online</button></div>
    <span class="cnt" id="cnt">0</span>
    <span id="reloj"></span>
    <button class="btn" id="btnSonido">🔇 Activar sonido</button>
    <button class="btn" id="btnFull" title="Pantalla completa">⛶</button>
    <button class="btn" id="btnSalir" title="Salir">⏻</button>
  </header>
  <div id="tablero"></div>
  <div class="listos" id="listos"></div>
</div>
<div id="toast"></div>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBuzHcQezxE36F6nDJWqYsE5rOKUvQbMBM",
  authDomain: "tienda-test-burgers.firebaseapp.com",
  projectId: "tienda-test-burgers",
  storageBucket: "tienda-test-burgers.firebasestorage.app",
  messagingSenderId: "406623629835",
  appId: "1:406623629835:web:31152eac803ed8c679cd0e"
};
let STORE_ID = "test-burgers", auth, filtro = "todo", pedidos = [], vistos = null, sonido = false, audio = null, timer = null, nombreTienda = "";
const qs = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const min = iso => Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 60000));
function toast(t){ const e = qs("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 2500); }
/* Productos tachados por la cocina (solo en esta pantalla) */
let hechos = {}; try { hechos = JSON.parse(localStorage.getItem("cocina_hechos") || "{}"); } catch(e){}
const guardarHechos = () => { try { localStorage.setItem("cocina_hechos", JSON.stringify(hechos)); } catch(e){} };

async function api(accion, datos){
  const t = await auth.currentUser.getIdToken();
  const r = await fetch("/api/cajaLocal", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + t },
    body: JSON.stringify(Object.assign({ accion, storeId: STORE_ID }, datos || {})) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.error || ("Error " + r.status));
  return j;
}
async function iniciar(){
  firebase.initializeApp(FIREBASE_CONFIG); auth = firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  try {
    const r = await fetch("https://firestore.googleapis.com/v1/projects/" + FIREBASE_CONFIG.projectId + "/databases/(default)/documents/dominios/" + encodeURIComponent(location.hostname));
    if (r.ok){ const j = await r.json(); const s = j.fields && j.fields.storeId && j.fields.storeId.stringValue; if (s) STORE_ID = s; }
  } catch(e){}
  auth.onAuthStateChanged(u => { if (u) entrar(); else { clearInterval(timer); qs("#app").classList.add("oculto"); qs("#login").classList.remove("oculto"); } });
}
qs("#lBtn").addEventListener("click", async () => {
  let id = qs("#lUsu").value.trim().toLowerCase();
  if (id && id.indexOf("@") < 0) id = id + "--" + STORE_ID + "@personal.derlabs.cl";
  qs("#lErr").textContent = "";
  try { await auth.signInWithEmailAndPassword(id, qs("#lPass").value); } catch(e){ qs("#lErr").textContent = "Usuario o clave incorrectos"; }
});
qs("#lPass").addEventListener("keydown", e => { if (e.key === "Enter") qs("#lBtn").click(); });
qs("#btnSalir").addEventListener("click", () => { if (confirm("¿Cerrar sesión en la cocina?")) auth.signOut(); });
qs("#btnFull").addEventListener("click", () => { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); });
qs("#btnSonido").addEventListener("click", () => {
  sonido = !sonido;
  if (sonido && !audio){ try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  qs("#btnSonido").textContent = sonido ? "🔔 Sonido activo" : "🔇 Activar sonido";
  if (sonido) beep();
});
function beep(){
  if (!sonido || !audio) return;
  [0, .18, .36].forEach(t => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; o.type = "square"; g.gain.value = .08; o.connect(g); g.connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .12); });
}
document.querySelectorAll(".fil").forEach(b => b.addEventListener("click", () => { filtro = b.dataset.f; document.querySelectorAll(".fil").forEach(x => x.classList.toggle("on", x === b)); pintar(); }));

async function entrar(){
  try { const e = await api("estado"); nombreTienda = ""; if (e.rol === "garzon" || e.rol === "cajero"){ location.href = "/caja"; return; } }
  catch(err){ qs("#lErr").textContent = err.message; qs("#login").classList.remove("oculto"); qs("#app").classList.add("oculto"); return; }
  qs("#login").classList.add("oculto"); qs("#app").classList.remove("oculto");
  cargar(); clearInterval(timer); timer = setInterval(() => { if (!document.hidden) cargar(); }, 4000);
}
setInterval(() => { qs("#reloj").textContent = new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }); pintar(); }, 20000);
async function cargar(){
  try { pedidos = (await api("pedidos")).pedidos || []; pintar(); }
  catch(e){ console.warn(e.message); }
}

/* Comandas: cada ronda de una mesa es una comanda; para llevar y online, una por pedido */
function comandas(){
  const out = [];
  pedidos.forEach(p => {
    if (p.estado === "cancelado" || p.cerrado && p.canal === "local" && !p.mesa) return;
    if (p.canal === "local" && p.mesa){
      if (p.cerrado && (p.rondasListas || []).length >= (p.rondas || 1)) return;
      for (let r = 1; r <= (p.rondas || 1); r++){
        if ((p.rondasListas || []).indexOf(r) >= 0) continue;
        const items = (p.items || []).filter(i => (i.ronda || 1) === r && !i.anulado);
        if (!items.length) continue;
        out.push({ k: p._docId + ":" + r, p, ronda: r, titulo: "🍽️ " + p.mesa.nombre, sub: (p.rondas > 1 ? "Ronda " + r + " · " : "") + "#" + p.id, desde: (items[0] && items[0].enviadoEn) || p.fecha, items, tipo: "local" });
      }
    } else if (p.canal === "local"){
      if (p.estado !== "preparacion") return;
      out.push({ k: p._docId, p, titulo: "🥡 " + String(p.cliente.nombre || "").replace(/^🥡\s*/, ""), sub: "Para llevar · #" + p.id, desde: (p.estadoTimeline && p.estadoTimeline.preparacion) || p.fecha, items: (p.items || []).filter(i => !i.anulado), tipo: "local" });
    } else {
      if (p.estado !== "preparacion" || p.cocinaListo) return;
      out.push({ k: p._docId, p, titulo: (p.tipo === "delivery" ? "🛵 Delivery" : "🏠 Retiro") + " · " + (p.cliente.nombre || ""), sub: "Online · #" + p.id, desde: (p.estadoTimeline && p.estadoTimeline.preparacion) || p.fecha, items: p.items || [], nota: p.cliente.notas, tipo: "web" });
    }
  });
  return out.sort((a, b) => String(a.desde).localeCompare(String(b.desde)));
}
function pintar(){
  const cs = comandas();
  const claves = cs.map(c => c.k);
  if (vistos){ const nuevas = claves.filter(k => vistos.indexOf(k) < 0); if (nuevas.length){ beep(); if (navigator.vibrate) navigator.vibrate(300); } }
  const recienNuevas = vistos ? claves.filter(k => vistos.indexOf(k) < 0) : [];
  vistos = claves;
  const vis = cs.filter(c => filtro === "todo" || c.tipo === filtro);
  qs("#cnt").textContent = cs.length;
  document.title = (cs.length ? "(" + cs.length + ") " : "") + "Cocina";
  qs("#tablero").innerHTML = vis.length ? vis.map(c => {
    const m = min(c.desde), color = m >= 20 ? "rojo" : m >= 10 ? "amarillo" : "";
    return '<div class="tk ' + color + (recienNuevas.indexOf(c.k) >= 0 ? " nuevo" : "") + '"><div class="tk-h"><div><b>' + esc(c.titulo) + '</b><small>' + esc(c.sub) + '</small></div><span class="min">' + m + "'</span></div>" +
      '<div class="tk-b">' + c.items.map((it, i) => {
        const hk = c.k + ":" + i, extra = [it.variantes ? Object.entries(it.variantes).map(([a, v]) => a + ": " + v).join(", ") : "", it.notaPersonal].filter(Boolean).join(" · ");
        return '<div class="li' + (hechos[hk] ? " hecho" : "") + '" data-h="' + esc(hk) + '"><span class="q">' + it.cantidad + '×</span><span>' + esc(it.nombre) + (extra ? "<small>⚠️ " + esc(extra) + "</small>" : "") + '</span></div>';
      }).join("") + '</div>' + (c.nota ? '<div class="tk-nota">📝 ' + esc(c.nota) + '</div>' : '') +
      '<div class="tk-f"><button class="btn btn-ok" data-listo="' + esc(c.p._docId) + '" data-ronda="' + (c.ronda || "") + '">✅ Listo</button></div></div>';
  }).join("") : '<div class="vacio">👌 Sin comandas pendientes</div>';
  const listos = pedidos.filter(p => p.estado !== "cancelado" && (p.cocinaListo || (p.canal === "local" && !p.mesa && p.estado === "listo"))).slice(0, 12);
  qs("#listos").innerHTML = listos.length ? '<h3>Listos recientes</h3><div>' + listos.map(p => '<span>' + esc(p.mesa ? p.mesa.nombre : (p.cliente.nombre || "#" + p.id)) + '</span>').join("") + '</div>' : "";
}
qs("#tablero").addEventListener("click", async e => {
  const li = e.target.closest("[data-h]");
  if (li){ hechos[li.dataset.h] = !hechos[li.dataset.h]; guardarHechos(); li.classList.toggle("hecho"); return; }
  const b = e.target.closest("[data-listo]"); if (!b) return;
  b.disabled = true; b.textContent = "…";
  try { await api("cocinaListo", { pedidoId: b.dataset.listo, ronda: Number(b.dataset.ronda) || undefined }); toast("✅ Comanda lista"); cargar(); }
  catch(err){ toast("❌ " + err.message); b.disabled = false; b.textContent = "✅ Listo"; }
});
qs("#reloj").textContent = new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
iniciar();
</script>
</body>
</html>

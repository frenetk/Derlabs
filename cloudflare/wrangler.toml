name = "derlabs-worker"
main = "worker.js"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../"
binding = "ASSETS"
run_worker_first = true
exclude = [
  "/cloudflare/**",
  "/netlify/**",
  "/.git/**",
  "/.gitignore"
]

[triggers]
crons = ["*/5 * * * *"]

[[routes]]
pattern = "derlabs.cl"
custom_domain = true

[[routes]]
pattern = "www.derlabs.cl"
custom_domain = true

[[routes]]
pattern = "derlabs.store"
custom_domain = true
